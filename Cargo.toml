[package]
name = "snocode"
version = "0.0.1"
edition = "2024"
description = "An early-stage terminal coding agent currently under development."
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/nate-noscope/snocode"
rust-version = "1.98"
exclude = ["flake.nix", "flake.lock"]

[dependencies]

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/nate-noscope/snocode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
